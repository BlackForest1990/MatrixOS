name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib nasm

      - name: Build kernel and user programs
        run: make all

      - name: Build with demos disabled (compile check)
        run: make clean && make CONFIG_DEMO_STARTUP=0 all
